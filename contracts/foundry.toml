[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
dynamic_test_linking = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "halmos-cheatcodes/=lib/halmos-cheatcodes/src/",
]


[fuzz]
runs = 512

[invariant]
runs = 128
depth = 32
fail_on_revert = false

[rpc_endpoints]
shannon = "https://api.infra.testnet.somnia.network"
mainnet = "https://api.infra.mainnet.somnia.network"

[etherscan]
shannon = { key = "unused", url = "https://shannon-explorer.somnia.network/api" }

[profile.ci]
verbosity = 3
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 64 }

